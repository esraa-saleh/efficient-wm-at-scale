# The real ~1B KD run on 2 H100s. Composed into SweepConfig.runs.kd_train by ../config.yaml's
# `runs@runs.kd_train: kd_train` defaults entry. Same job_name every time -> auto-resumes from
# train_state.pt instead of retraining from scratch, matching train.yaml's own convention.
# Every field below is real -- run_type=kd_live is the only thing that tells build_sbatch_script()
# to generate a train_kd.py invocation instead of a torchrun one; nothing here is unused filler.
job_name: cosmos_distill_experiments_kd_train
run_type: kd_live
gpus: 2

# Same account storage as train.yaml -- each run's yaml is the one file that fully determines it,
# so this is copied rather than shared via a conf/paths.yaml side file.
data_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only
output_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/cosmos_dit_wm_output

# All 4 suites + real rollout data, matching train.yaml's own change -- see its comments for why.
# Keeps the student's training distribution matched to the teacher's real production one, not just
# the teacher's per-sample construction knobs (batch_prep.py's DATASET_KWARGS already matched
# those; suites/rollout_data_dir were the remaining scope gap).
suites: [libero_object_regen, libero_goal_regen, libero_spatial_regen, libero_10_regen]
rollout_data_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/all_episodes

max_iter: 30000
batch_size: 8
log_every: 10
checkpoint_every: 200
lr: 1.0e-4

student_net_experiment_name: cosmos_kd_student_1b_libero
# Output of: python -m cosmos_policy.scripts.cosmos_distill_experiments.kd.init_student_from_teacher
#   --student_size 1b --out <this path>
# Must exist before this run launches -- see README.md's "Launch (KD)" section.
student_init_path: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_inits/student_init_1b.pt


# See batch_prep.py's combined_kd_loss: the student's loss is a blend of the teacher's own
# prediction (pure distillation) and the real ground truth, weighted evenly.
ground_truth_loss_weight: 0.5

time_limit: "24:00:00"
mem: "80G"
cpus: 8
account: rrg-gberseth
filename: kd_train.sbatch
