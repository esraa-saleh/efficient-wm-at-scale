# Same run as kd_static_500m_std_0_05_syn_tn.yaml -- identical hyperparameters, identical
# distill_dataset_dir -- except synthetic_dataset_dir points at a MERGED directory combining
# build_teacher_native_distill_dataset.yaml's shards with build_synthetic_distill_dataset.yaml's
# shards (perturbed-action synthetic, real action perturbed and held fixed as conditioning) instead
# of the teacher-native ones alone. DistillShardDataset just globs shard_*.pt under one directory
# (see distill_dataset.py), so the two sources are combined via symlinks with disjoint filenames,
# same idea as submit_sweep.py's resolve_dataset_dir does for multi-suite LIBERO data -- build this
# merged dir ONCE (see README.md's "Static KD" section for the exact commands) before launching
# this run:
#
#   mkdir -p $COSMOS_POLICY_STORAGE/kd_synthetic_distill_dataset_merged_std_0_05
#   cd $COSMOS_POLICY_STORAGE/kd_synthetic_distill_dataset_merged_std_0_05
#   for f in $COSMOS_POLICY_STORAGE/kd_teacher_native_distill_dataset/shard_*.pt; do
#     ln -s "$f" "shard_tn_$(basename "$f" | sed 's/^shard_//')"
#   done
#   for f in $COSMOS_POLICY_STORAGE/kd_synthetic_distill_dataset_std_0_05/shard_*.pt; do
#     ln -s "$f" "shard_pa_$(basename "$f" | sed 's/^shard_//')"
#   done
#
# Data variant 2 of 2: original data + teacher-analogous synthetic + perturbed-action synthetic.
# Composed into SweepConfig.runs.kd_static_500m_std_0_05_syn_tn_pa by ../config.yaml's
# `runs@runs.kd_static_500m_std_0_05_syn_tn_pa: kd_static_500m_std_0_05_syn_tn_pa` defaults entry.
job_name: cosmos_distill_experiments_kd_static_500m_std_0_05_syn_tn_pa
run_type: kd_static
gpus: 1

data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

student_device: cuda:0

max_iter: 60000
batch_size: 8
log_every: 10
checkpoint_every: 100
lr: 1.0e-4

student_net_experiment_name: cosmos_kd_student_500m_libero
student_init_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_inits/student_init_500m.pt

ground_truth_loss_weight: 0.5

distill_dataset_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_distill_dataset_std_0_05
# Merged teacher-native + perturbed-action synthetic shards -- see this file's own header comment
# for the one-time symlink-merge command that must be run before this dataset dir has any shards.
synthetic_dataset_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_synthetic_distill_dataset_merged_std_0_05

seed: 0
time_limit: "12:00:00"
mem: "150G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: kd_static_500m_std_0_05_syn_tn_pa.sbatch
