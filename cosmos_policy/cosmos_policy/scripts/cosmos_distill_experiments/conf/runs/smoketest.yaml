# Sanity check that this pipeline (config registered via the config/experiment/ shim, run_train.py
# launching, checkpoint/loss-csv writing) actually works end-to-end before trusting train.yaml's
# real 30000-iter/12h run. Deliberately a DIFFERENT job_name -- distinct checkpoint dir and loss
# CSV, never touches train's existing checkpoints or resumes from them (checkpoint.load_path="" is
# inherited from the tiny experiment, so this always starts at iteration 0).
#
# max_iter=1: trainer.py always force-saves a checkpoint once the training loop exits, even when
# iteration % save_iter != 0 (see the unconditional self.checkpointer.save(...) right after the
# loop in trainer.py / _src/imaginaire/trainer.py) -- so 1 iteration is enough to exercise the
# checkpoint-write path without waiting on save_iter to land exactly on a multiple.
job_name: cosmos_distill_experiments_smoketest

# Same account storage as train.yaml -- each run's yaml is the one file that fully determines it,
# so this is copied rather than shared via a conf/paths.yaml side file.
data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

# References train.yaml's already-registered experiment by name -- doesn't define its own
# architecture (base_experiment/model_channels/etc.), unlike train.yaml.
experiment: cosmos_dit_wm_tiny_libero_from_scratch
suites: [libero_object_regen]
max_iter: 1
batch_size: 8
checkpoint_save_iter: 5
time_limit: "00:10:00"
mem: "40G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: smoketest.sbatch
