# A genuinely SMALL, fast smoketest of build_distill_dataset.py -- exists because the real
# build_distill_dataset_std_0.05.yaml's scope (all 4 LIBERO suites + the full 2000-episode/8.1GB
# all_episodes rollout set) makes dataset construction alone take many minutes regardless of how
# few batches you actually ask it to draw (LIBERODataset scans/indexes its full configured scope
# once, up front, before drawing anything) -- confirmed the hard way: a first attempt that only
# shrank num_batches/batch_size stayed slow because `suites`/`rollout_data_dir` were untouched;
# a second attempt that shrank `suites` to one but left `rollout_data_dir` at all 2000 files was
# STILL slow, since rollout scanning isn't filtered by `suites` at all.
#
# This config actually fixes both: `suites` is a single suite (`libero_object_regen`), and
# `rollout_data_dir` points at `all_episodes_smoketest_subset/` -- a directory of 20 symlinks into
# the real `all_episodes/` (all `suite=libero_object`, 18 success + 2 failure, built once by hand,
# not generated by this config) -- small enough to scan quickly while still containing real rollout
# data, so both demo and rollout sample types actually get drawn, not just skipped for lack of any
# rollout examples. (build_distill_dataset.py no longer does any action perturbation itself -- see
# its own module docstring -- so this smoketest's only remaining job is exercising the small/fast
# dataset-build mechanics, not any perturbation path.)
#
# Writes to its own distill_dataset_dir -- never touches the real kd_distill_dataset_std_0_05/_10.
job_name: cosmos_distill_experiments_build_distill_dataset_std_0_05_smoketest
run_type: build_distill_dataset
gpus: 1

data_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only
output_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/cosmos_dit_wm_output

suites: [libero_object_regen]
rollout_data_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/all_episodes_smoketest_subset

# Deliberately tiny -- this exists to catch shape/logic errors, not to produce a usable dataset.
num_batches: 3
noise_draws_per_batch: 1
batch_size: 4
examples_per_shard: 50

distill_dataset_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_distill_dataset_std_0_05_smoketest

# Short on purpose -- a smoketest requesting the real build's 11:59:00 walltime hurts queue
# priority for no reason (see submit_sweep.py's own scheduling notes). Teacher loading alone can
# take many minutes depending on per-node filesystem contention (see submit_sweep.py's
# TEACHER_CHECKPOINT_PREFETCH, which mitigates but doesn't eliminate this) -- 30 min leaves real
# margin beyond that plus the tiny dataset scan + 3 batches.
time_limit: "00:30:00"
mem: "80G"
cpus: 8
account: rrg-gberseth
filename: build_distill_dataset_std_0_05_smoketest.sbatch
