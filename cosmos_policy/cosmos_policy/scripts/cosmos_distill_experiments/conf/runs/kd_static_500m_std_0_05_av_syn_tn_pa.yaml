# Same run as kd_static_500m_std_0_05_syn_tn_pa.yaml -- identical hyperparameters,
# distill_dataset_dir, and merged synthetic_dataset_dir (see that file's header comment for the
# one-time symlink-merge command that must be run before this dataset dir has any shards) -- except
# run_type: kd_static_av routes build_sbatch_script() to train_kd_static_av.py instead, which drops
# future-state prediction from BOTH loss terms (see train_kd_static_av.py's own module docstring).
# Data variant 2 of 2: original data + teacher-analogous synthetic + perturbed-action synthetic.
# Composed into SweepConfig.runs.kd_static_500m_std_0_05_av_syn_tn_pa by ../config.yaml's
# `runs@runs.kd_static_500m_std_0_05_av_syn_tn_pa: kd_static_500m_std_0_05_av_syn_tn_pa` defaults
# entry.
job_name: cosmos_distill_experiments_kd_static_500m_std_0_05_av_syn_tn_pa
run_type: kd_static_av
gpus: 1

data_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only
output_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/cosmos_dit_wm_output

student_device: cuda:0

max_iter: 60000
batch_size: 8
log_every: 10
checkpoint_every: 100
lr: 1.0e-4

student_net_experiment_name: cosmos_kd_student_500m_libero
student_init_path: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_inits/student_init_500m.pt

ground_truth_loss_weight: 0.5

distill_dataset_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_distill_dataset_std_0_05
synthetic_dataset_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_synthetic_distill_dataset_merged_std_0_05

seed: 0
time_limit: "12:00:00"
mem: "150G"
cpus: 8
account: rrg-gberseth
filename: kd_static_500m_std_0_05_av_syn_tn_pa.sbatch
