# Continuous full-suite eval companion to teacher_on_demos_500m_train -- baseline_500m_train_eval.yaml
# (closed-loop LIBERO sim: eval just rolls out the trained student, no teacher targets involved)
# with job_name / monitored_job_name changed AND eval_dataset_stats_path pointed at the teacher's
# stats file. The student was trained in the teacher's normalization convention
# (teacher_on_demos_500m_train.dataset_stats_override_path), so its predicted actions must be
# un-normalized with the same file or the sim gets wrong commands.
#
# SCORING: no eval_task_keyword -> full suite. Every checkpoint is scored on all 10 libero_object
# tasks x eval_num_trials_per_task (3) rollouts. eval_results.csv's success_rate is the mean over
# tasks (equal trials/task); run_libero_eval.py also drops a per-task breakdown CSV
# (<local_log_dir>/<run_id>_results.csv) per checkpoint. Directly comparable to baseline_500m_train's.
job_name: cosmos_distill_experiments_teacher_on_demos_500m_train_eval
run_type: kd_static_eval
gpus: 1

data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

# Must exactly match teacher_on_demos_500m_train.yaml's own job_name.
monitored_job_name: cosmos_teacher_on_demos_500m_train

eval_task_suite_name: libero_object
eval_num_trials_per_task: 3
eval_checkpoint_format: dcp
# One full-suite pass = 10 tasks x 3 trials ~= 32 min. The train job saves a checkpoint every 200
# iters (checkpoint_save_iter), so at 63000 iters there are 315 of them -- ~168h of eval work
# against a 60h walltime, i.e. the default (score every checkpoint) would only ever cover the first
# ~third of training. Score every 1000 iters instead: 63 checkpoints, ~34h, eval throughput
# (~31 iter/min) slightly outpaces training (~26 iter/min) so it tracks the run and finishes just
# after it, covering the whole 0..63000 range. 63 points is plenty for the success curve.
# periodic_libero_eval_static.py seeds `evaluated` from eval_results.csv on startup, so the
# already-scored 200/400/600/800 rows are kept, not redone.
eval_every_n_iters: 1000

eval_inference_experiment: cosmos_kd_student_500m_libero__inference_only
# The TEACHER's stats (staged copy of nvidia/Cosmos-Policy-LIBERO-Predict2-2B's
# libero_dataset_statistics.json) -- NOT the local libero_object_regen/dataset_statistics.json.
# Must equal teacher_on_demos_500m_train.dataset_stats_override_path.
eval_dataset_stats_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only/teacher_libero_dataset_statistics.json
eval_t5_text_embeddings_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only/t5_embeddings.pkl

# Must outlast the train job (63000 iters, ~42h + margin). Eval polls checkpoints then idles to
# walltime once training stops -- a TIMEOUT here after the last checkpoint is scored is expected,
# no data lost (same pattern as the ketchup K=5 eval).
time_limit: "60:00:00"
mem: "40G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: teacher_on_demos_500m_train_eval.sbatch
