# Continuous full-suite eval companion to kd_static_500m_std_0_05 (see
# kd/periodic_libero_eval_static.py's module docstring and README.md's "Continuous eval" section):
# a SEPARATE Slurm job that sim-evals that run's checkpoints/ as they appear, logging every result
# -- it never feeds back into training in any way (no stopping criterion, nothing written back to
# the training run's own directory). Launch alongside (not instead of) the training run itself --
# it has nothing to do until a checkpoint exists, so submitting it early is harmless, just idle
# polling until the first one appears. If this job is halted (preemption, walltime, manual cancel),
# resubmitting it picks up exactly where it left off -- see periodic_libero_eval_static.py's
# load_already_evaluated, which reads this job's own eval_results.csv at startup.
job_name: cosmos_distill_experiments_kd_static_500m_std_0_05_eval
run_type: kd_static_eval
gpus: 1

# Same account storage as train.yaml -- each run's yaml is the one file that fully determines it,
# so this is copied rather than shared via a conf/paths.yaml side file.
data_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only
output_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/cosmos_dit_wm_output

# Must exactly match kd_static_500m_std_0_05.yaml's own job_name -- that's how submit_sweep.py
# resolves which run's checkpoints/ to watch.
monitored_job_name: cosmos_distill_experiments_kd_static_500m_std_0_05

# Full suite (every task in libero_object), 3 trials/task = 30 episodes per checkpoint evaluated --
# real coverage, not a narrow subset. Every checkpoint under checkpoints/ gets exactly this, at
# whatever cadence the training run's own checkpoint_every produces them (300 checkpoints over a
# 30000-iteration run at checkpoint_every=100) -- this job's own restart-safety is what makes that
# tractable across more than one Slurm allocation if needed, not a single long-enough time_limit.
eval_task_suite_name: libero_object
eval_num_trials_per_task: 3

# Inference-mode registration of the same student size this is monitoring (net_experiments.py) --
# narrows the SDE sigma range for sampling, same as every other eval config in this folder.
eval_inference_experiment: cosmos_kd_student_500m_libero__inference_only
eval_dataset_stats_path: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only/libero_object_regen/dataset_statistics.json
eval_t5_text_embeddings_path: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only/t5_embeddings.pkl

time_limit: "23:59:00"
mem: "40G"
cpus: 8
account: rrg-gberseth
filename: kd_static_500m_std_0_05_eval.sbatch
