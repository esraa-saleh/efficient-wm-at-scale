# Same run as kd_static_500m_std_0_05_syn_tn.yaml (the best-performing of the 6 500m KD variants,
# iter-59999 success 3.3%), but at ~1B student size -- isolates model size at FIXED KD loss-type,
# the size-matched pairing baseline_1b_train couldn't provide on its own (no kd_static_1b_* run
# existed, so baseline_1b_train vs. the 6 KD variants confounded size with loss-type -- see
# experiment_journal.txt's 2026-08-25 entry asking this question). Companion to
# baseline_500m_train.yaml, which does the reverse isolation (non-KD at 500M size).
# Composed into SweepConfig.runs.kd_static_1b_std_0_05_syn_tn by ../config.yaml's
# `runs@runs.kd_static_1b_std_0_05_syn_tn: kd_static_1b_std_0_05_syn_tn` defaults entry.
job_name: cosmos_distill_experiments_kd_static_1b_std_0_05_syn_tn
run_type: kd_static
gpus: 1

# Same account storage as kd_static_500m_std_0_05_syn_tn.yaml -- each run's yaml is the one file
# that fully determines it, so this is copied rather than shared via a conf/paths.yaml side file.
data_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/LIBERO-Cosmos-Policy/success_only
output_root: /project/rrg-gberseth/esraa1/cosmos_policy_storage/cosmos_dit_wm_output

# kd_static never loads a teacher (see sweep.py's RunConfig.student_device docstring), so there's no
# second accelerator to keep clear of -- overrides the "cuda:1" default that only matters for
# kd_live's teacher+student split.
student_device: cuda:0

# Matches kd_static_500m_std_0_05_syn_tn.yaml's own value for a like-for-like comparison -- only
# student_net_experiment_name/student_init_path (size) differ between this file and that one.
max_iter: 60000
batch_size: 8
log_every: 10
checkpoint_every: 100
lr: 1.0e-4

student_net_experiment_name: cosmos_kd_student_1b_libero
# Output of: python -m cosmos_policy.scripts.cosmos_distill_experiments.kd.init_student_from_teacher
#   --student_size 1b --out <this path>
# Already built (job 19597958, for baseline_1b_train.yaml's own prep -- see
# experiment_journal.txt's 2026-08-25 entry) -- the SAME flat .pt baseline_1b_train.yaml's DCP
# sibling was derived from, reused here unmodified since kd_static loads the flat file directly via
# its own code (unlike baseline_1b_train.yaml's DCP-directory requirement).
student_init_path: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_inits/student_init_1b.pt

# This dataset was built with x0 (ground truth) stored specifically to support this -- see
# kd/params.py's StaticTrainParams docstring. Matches kd_static_500m_std_0_05_syn_tn.yaml's own
# value for a fair comparison beyond just model size.
ground_truth_loss_weight: 0.5

# Real recorded data (build_distill_dataset_std_0.05.yaml's output) -- same distill_dataset_dir
# every 500m variant in that sweep trains its "real" term against; reused here unmodified since the
# teacher-generated targets don't depend on student size.
distill_dataset_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_distill_dataset_std_0_05
# build_teacher_native_distill_dataset.yaml's --out_dir: teacher-analogous synthetic data (teacher's
# own freely-generated action, future state, and value, sampled jointly, nothing held fixed).
synthetic_dataset_dir: /project/rrg-gberseth/esraa1/cosmos_policy_storage/kd_teacher_native_distill_dataset

seed: 0
time_limit: "12:00:00"
# Same as kd_static_500m_std_0_05_syn_tn.yaml's own 150G -- kept unchanged since the KD variants'
# memory footprint is dominated by the precomputed distill/synthetic datasets, not student params;
# the ~2x param increase (500M -> 988M) adds only a modest amount of optimizer-state/activation
# memory on top of that. Revisit if this run OOMs.
mem: "150G"
cpus: 8
account: rrg-gberseth
filename: kd_static_1b_std_0_05_syn_tn.sbatch
