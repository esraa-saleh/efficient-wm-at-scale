# baseline_500m_train.yaml (same experiment, size, data states, torchrun/Trainer path, joint EDM
# objective, teacher-derived DCP init, staging, eval) with four deliberate deltas, all required for
# the teacher_on_demos recipe:
#   1. teacher_on_demos_dir      -- the four joint denoising targets (action chunk, future image,
#                                   future proprio, value) come from the teacher's own generation
#                                   per demo state instead of the human demo.
#   2. teacher_on_demos_num_samples: 5  -- full-coverage over the K=5 sidecar (epoch expands to
#                                   num_steps*5). K=5 is the settled recipe; K=1 stays intermittent
#                                   even at 6000 iters (experiment_journal.txt 2026-09-08).
#   3. dataset_stats_override_path -- train in the TEACHER's normalization convention, because the
#                                   sidecar's action/future_proprio targets are stored verbatim in
#                                   it (no per-field renorm). The eval companion points
#                                   --dataset_stats_path at the same file.
#   4. max_iter: 63000           -- K=5 makes the epoch 5x larger (N*5 ~= 336k (state,k) pairs over
#                                   the 10 tasks, ~42k iters/epoch at batch 8). 63000 ~= 1.5 epochs,
#                                   matching the ketchup K=5 run's coverage (6000 iters / 1.5 passes
#                                   over its 31,705 pairs). baseline_500m_train's 30000 iters would
#                                   be only ~0.7 epoch here.
# Nothing in the training/loss path itself changes. Head-to-head partner of baseline_500m_train.
# Trains on ALL 10 libero_object tasks at once (no task_names filter) -- needs every per-task
# sidecar present + complete first. See kd/TEACHER_ON_DEMOS_PLAN.md.
job_name: cosmos_teacher_on_demos_500m_train

data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

experiment: cosmos_kd_student_500m_libero
suites: [libero_object_regen]
max_iter: 63000
batch_size: 8
checkpoint_save_iter: 200
num_workers: 4
stage_data_to_tmpdir: true
extra_overrides:
  checkpoint.load_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_inits/student_init_500m_dcp
# The teacher-target sidecar (built by build_teacher_on_demos.yaml). submit_sweep.py stages this to
# node-local NVMe alongside the suite (it's a sibling of the suite dir, so the suite's own cp -rL
# does not pick it up) and injects it as dataloader_train.dataset.teacher_on_demos_dir.
teacher_on_demos_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only/libero_object_regen__teacher_on_demos
# Full-coverage over the K=5 sidecar: epoch = num_steps * 5, every teacher sample visited once.
# MUST match the build's num_teacher_samples (build_teacher_on_demos.yaml = 5).
teacher_on_demos_num_samples: 5
# Train in the teacher checkpoint's own normalization (a staged copy of
# nvidia/Cosmos-Policy-LIBERO-Predict2-2B/libero_dataset_statistics.json). The sidecar targets are
# stored verbatim in this convention; the eval companion's eval_dataset_stats_path is the same file.
dataset_stats_override_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only/teacher_libero_dataset_statistics.json
# Distinct from baseline_500m_train's 12343 / baseline_1b's 12341 -- avoids torchrun rendezvous
# EADDRINUSE if this lands on the same physical node as another 1-GPU torchrun job.
master_port: 12345
# ~2.4 s/iter (ketchup K=5) x 63000 ~= 42h + staging/margin. 60h routes to gpubase b4 (72h cap).
# Job releases the node the moment iter hits max_iter regardless; torchrun path auto-resumes from
# the latest checkpoint on resubmit if it ever runs out.
time_limit: "60:00:00"
mem: "40G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: teacher_on_demos_500m_train.sbatch
