# The real job: resumes from the existing checkpoint (same job_name -> same job.path_local ->
# checkpoints/latest_checkpoint.txt) instead of retraining from scratch. Composed into
# SweepConfig.runs.train by ../config.yaml's `runs@runs.train: train` defaults entry -- see
# ../../sweep.py for the RunConfig schema these fields are validated against.
job_name: cosmos_distill_experiments

# Cluster-storage paths, specific to this account's allocation. Every other run in this folder
# copies the same two values -- deliberately, so each run's yaml stays the one file that fully
# determines it, rather than sharing a conf/paths.yaml side file.
data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

# Hydra *experiment* name (the recipe) this run both DEFINES (see the architecture fields below,
# read by experiment.py to register it) and launches -- not the Slurm *job* name above. This exact
# string is a real cross-folder dependency: ../../cosmos_dit_wm/submit_sweep.py launches a separate
# run (job_name=cosmos_dit_wm_tiny_libero_object_suite_v2) against this same experiment name, so it
# must not change even though this folder itself was renamed from
# cosmos_dit_wm_tiny_libero_object_suite.
experiment: cosmos_dit_wm_tiny_libero_from_scratch

# Real production LIBERO recipe (config/experiment/cosmos_policy_experiment_configs.py) this
# inherits from before the tiny/single-GPU overrides below.
base_experiment: cosmos_predict2_2b_480p_libero

# fsdp_shard_size=8 (inherited from base_experiment) assumes 8 GPUs; 1 degenerates FSDP to no
# sharding, which is what a single-GPU job needs.
fsdp_shard_size: 1

# "Tiny" MiniTrainDIT trunk size -- same as every other stage in the roadmap (see
# ../../cosmos_dit_wm/cosmos_dit_frame_replace_stages.tex). Partial override on top of the
# inherited net config -- crossattn width, patch_spatial, in/out_channels, use_adaln_lora, etc. all
# stay inherited from the real 2B net, untouched.
model_channels: 128
num_blocks: 4
num_heads: 4

# Empty (falsy) load_path skips loading the released 2B checkpoint -- see `if self.load_path:` in
# _src/imaginaire/checkpointer/ddp.py -- so the tiny net trains from scratch instead of
# fine-tuning pretrained weights.
checkpoint_load_path: ""

# Inference-only variant: narrows the SDE's sigma range for inference-time sampling (vs. the wider
# range used for training), same as the released checkpoint's inference config. Partial override --
# p_mean, p_std, hybrid_sigma_distribution, uniform_lower/upper all stay inherited.
inference_sigma_max: 80.0
inference_sigma_min: 4.0
inference_job_group: cosmos_v2_inference

# All 4 available suites (see $COSMOS_POLICY_STORAGE/LIBERO-Cosmos-Policy/success_only/),
# merged into their union (see sweep.py's RunConfig.suites) -- matches the real production recipe's
# own libero_all_4_suites_dataset (cosmos_policy_experiment_configs.py), rather than the narrower
# single-suite scope this job used before.
suites: [libero_object_regen, libero_goal_regen, libero_spatial_regen, libero_10_regen]
# Real successful+failed rollout trajectories, matching libero_all_4_suites_dataset's own
# rollout_data_dir -- previously left unset (empty), which made demonstration_sampling_prob/
# success_rollout_sampling_prob inert (LIBERODataset skips rollout loading entirely when this is
# falsy), so every sample was a demonstration regardless of those knobs.
rollout_data_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/all_episodes
max_iter: 30000
batch_size: 8
checkpoint_save_iter: 200
time_limit: "12:00:00"
mem: "40G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: train.sbatch
