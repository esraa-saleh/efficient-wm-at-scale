# A genuinely SMALL, fast smoketest of train_kd_static.py's NEW synthetic-batch loss term (see
# train_kd_static.py's own module docstring for the two-term total loss) -- exercises the real call
# graph (distill_dataset.sample_micro_batch against a second DistillShardDataset,
# student.denoise(...), combined_kd_loss(..., 0.0)) against the real smoketest-scale datasets
# already built this session: kd_distill_dataset_std_0_05_smoketest (real data) and
# kd_synthetic_distill_dataset_std_0_05_smoketest (12 examples, built by
# build_synthetic_distill_dataset_smoketest -- see conf/runs/datasets/ for that config). Not meant
# to produce a usable student -- just to confirm the synthetic term runs end to end without error
# and produces a sane (finite, nonzero) synthetic_distill_loss.
job_name: cosmos_distill_experiments_kd_static_synthetic_smoketest
run_type: kd_static
gpus: 1

data_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/LIBERO-Cosmos-Policy/success_only
output_root: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/cosmos_dit_wm_output

student_device: cuda:0

# Deliberately tiny -- batch_size must fit the smallest dataset in play (the synthetic smoketest
# set has exactly 12 examples).
max_iter: 3
batch_size: 4
log_every: 1
checkpoint_every: 3
lr: 1.0e-4

student_net_experiment_name: cosmos_kd_student_500m_libero
student_init_path: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_inits/student_init_500m.pt

ground_truth_loss_weight: 0.5

distill_dataset_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_distill_dataset_std_0_05_smoketest
synthetic_dataset_dir: ${oc.env:COSMOS_POLICY_STORAGE,/project/rrg-gberseth/esraa1/cosmos_policy_storage}/kd_synthetic_distill_dataset_std_0_05_smoketest

seed: 0
time_limit: "00:20:00"
mem: "80G"
cpus: 8
account: ${oc.env:COSMOS_POLICY_ACCOUNT,rrg-gberseth}
filename: kd_static_synthetic_smoketest.sbatch
